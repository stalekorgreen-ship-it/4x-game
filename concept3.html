{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');let s=+q.get('bg')||5;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};

 // дымка у основания
 blob(x,W*.3,H*1.0,W*.35,'rgba(210,120,60,.18)');
 for(let i=0;i<7000;i++){const a=.2+r()*.8,rr=r()<.015?1.5:r()<.2?.95:.55;x.fillStyle=r()<.1?`rgba(255,${200+r()*50|0},160,${a})`:r()<.15?`rgba(170,200,255,${a})`:`rgba(255,255,255,${a})`;x.beginPath();x.arc(r()*W,r()*H,rr,0,6.3);x.fill()}
 for(let i=0;i<6;i++){const px=r()*W,py=r()*H*.6,rr=5+r()*10;blob(x,px,py,rr*3,'rgba(190,210,255,.45)');x.fillStyle='rgba(255,255,255,.85)';x.fillRect(px-rr*3,py-.7,rr*6,1.4);x.fillRect(px-.7,py-rr*3,1.4,rr*6);x.beginPath();x.arc(px,py,2,0,6.3);x.fill()}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;sc.background=t}
if(q.get('plain'))sc.background=new THREE.Color(0x181b22);

 for(let i=0;i<120;i++){x.fillStyle=`rgba(70,80,100,${.06+R()*.1})`;x.fillRect(R()*1024,R()*256,6+R()*40,3+R()*14)}

// ---------- гранёная лофт-форма: восьмиугольное сечение, все фаски 45° ----------
const T15=Math.tan(Math.PI/12),T30=Math.tan(Math.PI/6);
function loftR(rings){const P=[],UV=[],I=[];const n=rings.length;
 for(let r=0;r<n;r++){const{x,w,h}=rings[r],c=Math.min(w,h)*.3,a=w/2,b=h/2;
  const ring=[[-(a-c),b],[a-c,b],[a,b-c],[a,-(b-c)],[a-c,-b],[-(a-c),-b],[-a,-(b-c)],[-a,b-c]];
  for(let k=0;k<=8;k++){const[z,y]=ring[k%8];P.push(x,y,z);UV.push(x/5,k/8)}}
 for(let r=0;r<n-1;r++)for(let k=0;k<8;k++){const a=r*9+k,b=a+9;I.push(a,b,a+1,b,b+1,a+1)}
 for(const[r,dir]of[[0,-1],[n-1,1]]){const ci=P.length/3;P.push(rings[r].x,0,0);UV.push(0,0);for(let k=0;k<8;k++){const a=r*9+k;if(dir>0)I.push(ci,a,a+1);else I.push(ci,a+1,a)}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(UV,2));g.setIndex(I);g.computeVertexNormals();return g}
// копьё: корма, ступени по 45°, длинный нос под углом tn (15° или 30° от оси)
function spearRings(L,W,Hr,tn){const R_=[],nose=(W*.5-W*.1)/tn,tip=W*.12;let x=-L/2,w=W*.72;R_.push({x,w,h:w*Hr});x+=(W-w)/2;w=W;R_.push({x,w,h:w*Hr});
 const body=L-nose-(x+L/2),ns=3+((R()*2)|0),ws=[];let tot=0;for(let i=0;i<ns;i++){ws.push(.5+R());tot+=ws[i]}
 const scl=[1.0,.78,1.18,.86,1.1];
 for(let i=0;i<ns;i++){const len=body*ws[i]/tot,nw=W*scl[(i+1+((R()*2)|0))%5];const ramp=Math.abs(nw-w)/2;
  x+=Math.max(.001,len-ramp);R_.push({x,w,h:w*Hr});x+=ramp;w=nw;R_.push({x,w,h:w*Hr})}
 const xn=L/2-nose;if(x<xn){x=xn;R_.push({x,w,h:w*Hr})}
 R_.push({x:L/2,w:tip,h:tip*Hr});return R_}
function poly(pts,th,bev){const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));sh.closePath();
 const ge=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:1});ge.translate(0,0,-th/2);return ge}

function makeShip(L,sd){seed=sd*977+13;const g=new THREE.Group();const W=L*(.14+R()*.04),Hr=.62+R()*.2;
 const tn=R()<.6?T15:T30;
 g.add(new THREE.Mesh(loftR(spearRings(L,W,Hr,tn)),silver));
 const nt=1+((R()*3)|0);for(let i=0;i<nt;i++){const tl=L*(.12+R()*.14),tw=W*(.42+R()*.3),tx=(R()-.35)*L*.42;
  const t=new THREE.Mesh(loftR([{x:-tl/2,w:tw*.7,h:tw*.5},{x:-tl/2+tw*.15,w:tw,h:tw*.7},{x:tl/2-tw*.5,w:tw,h:tw*.7},{x:tl/2,w:tw*.4,h:tw*.25}]),silver);t.position.set(tx,W*Hr*.4+tw*.25,(R()-.5)*W*.2);g.add(t)}
 if(R()<.8){const rl=L*(.35+R()*.15),pw=W*.34;for(const sg of[-1,1]){const p=new THREE.Mesh(loftR(spearRings(rl,pw,.8,T15)),silver);p.position.set(L*.05,-W*.02,sg*W*.55);g.add(p)}}
 // дельта-крылья: кромки 45° и 30°
 const span=L*(.13+R()*.07),wx=-L*(.02+R()*.1),th=W*.16,ax=L*.22;
 for(const sg of[-1,1]){const pts=[[ax,0],[ax-span,span],[ax-span-L*.05,span],[ax-span-L*.05+span*T30*2,0]];const ge=poly(pts,th,th*.45);ge.rotateX(-Math.PI/2);if(sg>0)ge.scale(1,1,-1);
  const m=new THREE.Mesh(ge,silverW);m.position.set(wx,-W*.12,sg*W*.4);m.rotation.x=sg*.07;g.add(m);
  const s2=span*.5,p2=[[L*.07,0],[L*.07-s2,s2],[L*.07-s2-L*.03,s2],[L*.07-s2-L*.03+s2*T30*2,0]];const g2=poly(p2,th*.8,th*.35);g2.rotateX(-Math.PI/2);if(sg>0)g2.scale(1,1,-1);const m2=new THREE.Mesh(g2,silverW);m2.position.set(L*.3,-W*.05,sg*W*.3);g.add(m2);
  // хвостовой плавник: передняя кромка 30° от вертикали
  const fh=L*(.1+R()*.05),fl=L*.2,fin=poly([[0,0],[-fl,0],[-fl-fh*T30*1.2,fh],[-fh*T30*1.2-L*.03,fh]],th*.8,th*.3);const f=new THREE.Mesh(fin,silverW);f.position.set(-L*.08,W*Hr*.4,sg*W*.3);f.rotation.x=sg*.18;g.add(f)}
 const ne=2+((R()*3)|0);for(let i=0;i<ne;i++){const z=(i-(ne-1)/2)*W*.75/ne*1.2,y=(i%2?.1:-.05)*W,nr=W*.2;
  const nz=new THREE.Mesh(new THREE.CylinderGeometry(nr,nr*1.25,W*.35,8,1,true),dark);nz.rotation.z=Math.PI/2;nz.position.set(-L/2-W*.1,y,z);g.add(nz);
  const d=new THREE.Mesh(new THREE.CircleGeometry(nr*1.1,8),glowM);d.rotation.y=-Math.PI/2;d.position.set(-L/2-W*.26,y,z);g.add(d);
  const fl=new THREE.Mesh(new THREE.ConeGeometry(nr*1.1,L*.12,8,1,true),new THREE.MeshBasicMaterial({color:0x7fb8ff,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));fl.rotation.z=Math.PI/2;fl.position.set(-L/2-W*.26-L*.06,y,z);g.add(fl)}
 g.userData.L=L;return g}

 const spec=[[16,1,-4,0,-14],[13,2,10,2,-20],[10,3,-24,-1,-6],[10,4,22,-2,-8],[8,5,-10,1,4],[8,6,-27,2,12],[7,7,6,-1,6],[7,8,28,3,2],[5.5,9,-14,3,16],[5,10,14,1,14],[6,11,-1,2,18],[5,12,34,-1,14]];
 for(const[L,sd,x,y,z]of spec){const s=makeShip(L,sd);s.position.set(x,y,z);s.rotation.y=-.5+((sd*37)%7-3)*.03;s.rotation.z=((sd*17)%5-2)*.012;sc.add(s)}

<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><canvas id=c></canvas>

import { mergeVertices } from 'three/examples/jsm/utils/BufferGeometryUtils.js';
const q=new URLSearchParams(location.search),W=+q.get('w')||1600,H=+q.get('h')||1000;
const cv=document.getElementById('c');const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});ren.setSize(W,H,false);ren.setPixelRatio(1);ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=.85;
const sc=new THREE.Scene();
let seed=+q.get('s')||7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
// ---------- фон: звёзды + столпы туманности (экранный) ----------
{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');let s=+q.get('bg')||5;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
 const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#04091c');gr.addColorStop(.55,'#0a1534');gr.addColorStop(1,'#0e1a3c');x.fillStyle=gr;x.fillRect(0,0,W,H);
 const blob=(c2,px,py,rr,col)=>{const g=c2.createRadialGradient(px,py,0,px,py,rr);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c2.fillStyle=g;c2.fillRect(px-rr,py-rr,rr*2,rr*2)};
 for(let i=0;i<14;i++)blob(x,r()*W,r()*H,W*(.12+r()*.2),['rgba(40,80,170,.22)','rgba(25,60,130,.25)','rgba(110,60,120,.12)'][i%3]);
 const L=document.createElement('canvas');L.width=W;L.height=H;const l=L.getContext('2d');
 const pil=(cx,base,h,w,tilt)=>{const N=9000;for(let i=0;i<N;i++){const t=Math.pow(r(),.8),y=base-t*h;
   const wd=w*(.5+.6*Math.sin(t*3.3+cx*.01)+.0)*(1-.55*t*t)+w*.12;const off=(r()-.5)*wd+Math.sin(t*5+cx)*w*.12+tilt*t*h;const px=cx+off,rr=10+r()*34*(1-t*.5);
   const rel=(off/wd)+.5;const lit=Math.max(0,1-rel*2.4);const noise=r();
   const R1=(60+lit*170+noise*30)|0,G1=(34+lit*95+noise*16)|0,B1=(22+lit*40)|0,a=.12+.1*noise+lit*.2;
   blob(l,px,y,rr,`rgba(${R1},${G1},${B1},${a})`)}
   // тающая вершина столпа
   for(let i=0;i<260;i++){const t=1-r()*.18,y=base-t*h-r()*h*.06,px=cx+tilt*h+(r()-.5)*w*.9*(1-t*.3);blob(l,px,y,4+r()*16,`rgba(${150+r()*90|0},${80+r()*50|0},${40+r()*20|0},${.06+.1*r()})`)}};
 pil(W*.2,H*1.2,H*.8,W*.14,-.08);pil(W*.42,H*1.2,H*1.0,W*.17,.05);pil(W*.64,H*1.2,H*.6,W*.11,-.04);pil(W*.06,H*1.2,H*.6,W*.09,.1);
 x.save();x.filter='blur(2.2px)';x.drawImage(L,0,0);x.restore();x.globalAlpha=.55;x.drawImage(L,0,0);x.globalAlpha=1;
 // дымка у основания
 blob(x,W*.3,H*1.0,W*.35,'rgba(210,120,60,.18)');
 for(let i=0;i<7000;i++){const a=.2+r()*.8,rr=r()<.015?1.5:r()<.2?.95:.55;x.fillStyle=r()<.1?`rgba(255,${200+r()*50|0},160,${a})`:r()<.15?`rgba(170,200,255,${a})`:`rgba(255,255,255,${a})`;x.beginPath();x.arc(r()*W,r()*H,rr,0,6.3);x.fill()}
 for(let i=0;i<6;i++){const px=r()*W,py=r()*H*.6,rr=5+r()*10;blob(x,px,py,rr*3,'rgba(190,210,255,.45)');x.fillStyle='rgba(255,255,255,.85)';x.fillRect(px-rr*3,py-.7,rr*6,1.4);x.fillRect(px-.7,py-rr*3,1.4,rr*6);x.beginPath();x.arc(px,py,2,0,6.3);x.fill()}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;sc.background=t}
const pm=new THREE.PMREMGenerator(ren);sc.environment=pm.fromScene(new RoomEnvironment(),.03).texture;sc.environmentIntensity=.8;
sc.add(new THREE.HemisphereLight(0xaac4ff,0x40302a,.35));
const sun=new THREE.DirectionalLight(0xfff2e0,3);sun.position.set(-12,16,8);sc.add(sun);
const rim=new THREE.DirectionalLight(0x7fa8ff,1.4);rim.position.set(10,-3,-14);sc.add(rim);
// ---------- детали корпуса: линии панелей ----------
const panelTex=(()=>{const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1024,256);
 for(let i=0;i<40;i++){const px=R()*1024;x.fillStyle=`rgba(60,70,90,${.12+R()*.2})`;x.fillRect(px,0,1.2,256)}
 for(let i=0;i<14;i++){const py=R()*256;x.fillStyle=`rgba(60,70,90,${.1+R()*.15})`;x.fillRect(0,py,1024,1.1)}
 for(let i=0;i<120;i++){x.fillStyle=`rgba(70,80,100,${.06+R()*.1})`;x.fillRect(R()*1024,R()*256,6+R()*40,3+R()*14)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t})();
const silver=new THREE.MeshPhysicalMaterial({color:0xcfd4dc,metalness:.8,roughness:.34,clearcoat:.5,clearcoatRoughness:.25,envMapIntensity:1.1,map:panelTex,bumpMap:panelTex,bumpScale:.6});
const silverW=silver.clone();silverW.side=THREE.DoubleSide;silverW.map=null;silverW.bumpMap=null;
const dark=new THREE.MeshStandardMaterial({color:0x2a3040,metalness:.7,roughness:.5});
const glowM=new THREE.MeshBasicMaterial({color:0xbfe0ff,toneMapped:false});
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
// ---------- гладкая лофт-форма со скруглённым сечением ----------
function loft(L,prof,{nR=110,nS=44,ex=2.6}={}){const P=[],U=[];
 for(let r=0;r<=nR;r++){const t=r/nR,{w,h,cy}=prof(t);for(let s=0;s<=nS;s++){const a=s/nS*6.2831853,c=Math.cos(a),sn=Math.sin(a);
  P.push((t-.5)*L,cy+h/2*Math.sign(sn)*Math.pow(Math.abs(sn),2/ex),w/2*Math.sign(c)*Math.pow(Math.abs(c),2/ex));U.push(t*(L/4),s/nS)}}
 const I=[];for(let r=0;r<nR;r++)for(let s=0;s<nS;s++){const a=r*(nS+1)+s,b=a+nS+1;I.push(a,b,a+1,b,b+1,a+1)}
 let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setIndex(I);
 g.deleteAttribute('uv');g=mergeVertices(g,1e-4);g.computeVertexNormals();
 // uv заново (после слияния потеряны) — цилиндрическая проекция
 const pa=g.attributes.position,uv=new Float32Array(pa.count*2);for(let i=0;i<pa.count;i++){uv[i*2]=pa.getX(i)/4*.9;uv[i*2+1]=Math.atan2(pa.getY(i),pa.getZ(i))/6.2831853+.5}g.setAttribute('uv',new THREE.BufferAttribute(uv,2));return g}
// профиль копья: корма-блок, расширение, ступени, длинный нос
function spear(W,Hr,steps,tn){return t=>{const stern=Math.sqrt(Math.max(0,1-Math.pow(1-sm(0,.07,t),2)));let e=stern;
  const nose=t>tn?Math.pow(1-Math.pow((t-tn)/(1-tn),1.35),.85):1;e*=Math.max(0,nose);
  let st=1;for(const[a,b,k]of steps)st*=1+(k-1)*sm(a-.025,a+.025,t)*(1-sm(b-.025,b+.025,t));
  const w=W*e*st*(1-.22*sm(.0,.12,t)*(1-sm(.1,.3,t)));return{w,h:w*Hr*(.88+.2*Math.sin(t*3)),cy:.02*W*Math.sin(t*3.4)}}}
// скруглённый многоугольник → Shape (углы не острее заданного радиуса)
function rpoly(pts,r){const sh=new THREE.Shape(),n=pts.length;for(let i=0;i<n;i++){const p0=pts[(i+n-1)%n],p1=pts[i],p2=pts[(i+1)%n];const d1=new THREE.Vector2(p0[0]-p1[0],p0[1]-p1[1]),d2=new THREE.Vector2(p2[0]-p1[0],p2[1]-p1[1]);const l1=d1.length(),l2=d2.length();d1.normalize();d2.normalize();const k=Math.min(r,l1*.45,l2*.45);const a=[p1[0]+d1.x*k,p1[1]+d1.y*k],b=[p1[0]+d2.x*k,p1[1]+d2.y*k];if(i===0)sh.moveTo(a[0],a[1]);else sh.lineTo(a[0],a[1]);sh.quadraticCurveTo(p1[0],p1[1],b[0],b[1])}sh.closePath();return sh}
function slab(pts,r,th,bev){const ge=new THREE.ExtrudeGeometry(rpoly(pts,r),{depth:th,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:4,curveSegments:10});ge.translate(0,0,-th/2);return ge}
// ---------- корабль ----------
function makeShip(L,sd){seed=sd*977+13;const g=new THREE.Group();const W=L*(.14+R()*.04),Hr=.62+R()*.2;
 const steps=[[.14+R()*.08,.42,1.2],[.42,.6+R()*.08,.88],[.3,.4,1.1],[.62,.72,.8]];
 const hull=new THREE.Mesh(loft(L,spear(W,Hr,steps,.58+R()*.12)),silver);g.add(hull);
 // надстройки: скруглённые башни и боковые «рельсы»
 const nt=1+((R()*3)|0);for(let i=0;i<nt;i++){const tl=L*(.12+R()*.14),tw=W*(.42+R()*.3),tx=(R()-.35)*L*.42;const t=new THREE.Mesh(loft(tl,spear(tw,.6,[],.5+R()*.2),{nR:50,nS:28}),silver);t.position.set(tx,W*Hr*.42+tw*.18,(R()-.5)*W*.2);g.add(t)}
 if(R()<.8){const rl=L*(.35+R()*.15);for(const sg of[-1,1]){const p=new THREE.Mesh(loft(rl,spear(W*.34,.8,[],.55),{nR:70,nS:28}),silver);p.position.set(L*.05,-W*.02,sg*W*.52);g.add(p)}}
 // дельта-крылья, стреловидные
 const span=L*(.13+R()*.07),wx=-L*(.02+R()*.1),th=W*.16;
 for(const sg of[-1,1]){const ge=slab([[L*.22,0],[-L*.3,span],[-L*.43,span*.9],[-L*.4,0]],L*.035,th,th*.55);ge.rotateX(-Math.PI/2);if(sg>0)ge.scale(1,1,-1);
  const m=new THREE.Mesh(ge,silverW);m.position.set(wx,-W*.12,sg*W*.4);m.rotation.x=sg*.07;g.add(m);
  // малое переднее крыло
  const g2=slab([[L*.07,0],[-L*.05,span*.5],[-L*.14,span*.45],[-L*.12,0]],L*.02,th*.8,th*.4);g2.rotateX(-Math.PI/2);if(sg>0)g2.scale(1,1,-1);const m2=new THREE.Mesh(g2,silverW);m2.position.set(L*.3,-W*.05,sg*W*.3);g.add(m2);
  // хвостовой плавник
  const fh=L*(.1+R()*.05),fin=slab([[0,0],[-L*.18,0],[-L*.3,fh],[-L*.2,fh*1.05]],L*.025,th*.8,th*.4);const f=new THREE.Mesh(fin,silverW);f.position.set(-L*.08,W*Hr*.4,sg*W*.3);f.rotation.x=sg*.18;g.add(f)}
 // двигатели
 const ne=2+((R()*3)|0);for(let i=0;i<ne;i++){const z=(i-(ne-1)/2)*W*.75/ne*1.2,y=(i%2?.1:-.05)*W,nr=W*.2;
  const nz=new THREE.Mesh(new THREE.CylinderGeometry(nr,nr*1.25,W*.35,24,1,true),dark);nz.rotation.z=Math.PI/2;nz.position.set(-L/2-W*.1,y,z);g.add(nz);
  const d=new THREE.Mesh(new THREE.CircleGeometry(nr*1.1,24),glowM);d.rotation.y=-Math.PI/2;d.position.set(-L/2-W*.26,y,z);g.add(d);
  const fl=new THREE.Mesh(new THREE.ConeGeometry(nr*1.1,L*.12,20,1,true),new THREE.MeshBasicMaterial({color:0x7fb8ff,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));fl.rotation.z=Math.PI/2;fl.position.set(-L/2-W*.26-L*.06,y,z);g.add(fl)}
 g.userData.L=L;return g}
// ---------- композиция ----------
const cam=new THREE.PerspectiveCamera(+q.get('fov')||38,W/H,.1,400);
if(q.get('fleet')){
 const spec=[[16,1,-4,0,-14],[13,2,10,2,-20],[10,3,-24,-1,-6],[10,4,22,-2,-8],[8,5,-10,1,4],[8,6,-27,2,12],[7,7,6,-1,6],[7,8,28,3,2],[5.5,9,-14,3,16],[5,10,14,1,14],[6,11,-1,2,18],[5,12,34,-1,14]];
 for(const[L,sd,x,y,z]of spec){const s=makeShip(L,sd);s.position.set(x,y,z);s.rotation.y=-.5+((sd*37)%7-3)*.03;s.rotation.z=((sd*17)%5-2)*.012;sc.add(s)}
 for(let i=0;i<6;i++){const s=makeShip(1.7+(i%2)*.3,20+i);s.position.set(38+(i%3)*2.2,.5+(i%2)*.8,-4+i*2.4);s.rotation.y=-.55;sc.add(s)}
 cam.position.set(-10,24,48);cam.lookAt(5,-1,-2);
}else{const L=12,s=makeShip(L,+q.get('i')||1);sc.add(s);const az=+q.get('az')||.5,el=+q.get('el')||.35,d=L*1.5;cam.position.set(Math.cos(el)*Math.cos(az)*d,Math.sin(el)*d,Math.sin(az)*Math.cos(el)*d);cam.lookAt(0,0,0)}
const comp=new EffectComposer(ren);comp.setSize(W,H);comp.addPass(new RenderPass(sc,cam));comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.28,.7,.88));comp.addPass(new OutputPass());
comp.render();window.done=true;

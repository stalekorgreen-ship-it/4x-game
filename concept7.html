<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><canvas id=c></canvas>
<script type=module>
import * as THREE from 'three';
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/examples/jsm/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search),W=+q.get('w')||1600,H=+q.get('h')||1000;
const cv=document.getElementById('c');const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});ren.setSize(W,H,false);ren.setPixelRatio(1);ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=.85;
const sc=new THREE.Scene();
{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const gr=x.createRadialGradient(W*.5,H*.45,50,W*.5,H*.5,W*.7);gr.addColorStop(0,'#1c2231');gr.addColorStop(1,'#07090f');x.fillStyle=gr;x.fillRect(0,0,W,H);
 let s=11;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let i=0;i<500;i++){x.fillStyle=`rgba(255,255,255,${.15+r()*.6})`;x.fillRect(r()*W,r()*H,1.2,1.2)}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;sc.background=t}
const pm=new THREE.PMREMGenerator(ren);sc.environment=pm.fromScene(new RoomEnvironment(),.03).texture;sc.environmentIntensity=.5;
sc.add(new THREE.HemisphereLight(0xaac4ff,0x40302a,.3));
const sun=new THREE.DirectionalLight(0xfff2e0,1.8);sun.position.set(-14,18,10);sc.add(sun);
const rim=new THREE.DirectionalLight(0x7fa8ff,1.2);rim.position.set(14,4,-12);sc.add(rim);
const mk=(c,m,r)=>new THREE.MeshPhysicalMaterial({color:c,metalness:m,roughness:r,flatShading:true,envMapIntensity:1.1,side:THREE.DoubleSide});
const silver=mk(0xa9b0bc,.8,.36),silver2=mk(0x8a929f,.8,.4),dark=mk(0x242a37,.7,.5),accent=mk(0xd9822b,.5,.45),steel=mk(0x6c7482,.85,.42);
const glowM=new THREE.MeshBasicMaterial({color:0xcfe8ff,toneMapped:false}),cyan=new THREE.MeshBasicMaterial({color:0x6fe3ff,toneMapped:false});
const plumeM=new THREE.MeshBasicMaterial({color:0x7fb8ff,transparent:true,opacity:.42,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,side:THREE.DoubleSide});
// ---- гранёные заготовки ----
function loftR(rings){const P=[],I=[];const n=rings.length;
 for(let r=0;r<n;r++){const{x,w,h}=rings[r],c=Math.min(w,h)*.3,a=w/2,b=h/2;const ring=[[-(a-c),b],[a-c,b],[a,b-c],[a,-(b-c)],[a-c,-b],[-(a-c),-b],[-a,-(b-c)],[-a,b-c]];for(let k=0;k<=8;k++){const[z,y]=ring[k%8];P.push(x,y,z)}}
 for(let r=0;r<n-1;r++)for(let k=0;k<8;k++){const a=r*9+k,b=a+9;I.push(a,b,a+1,b,b+1,a+1)}
 for(const[r,dir]of[[0,-1],[n-1,1]]){const ci=P.length/3;P.push(rings[r].x,0,0);for(let k=0;k<8;k++){const a=r*9+k;if(dir>0)I.push(ci,a,a+1);else I.push(ci,a+1,a)}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setIndex(I);g.computeVertexNormals();return g}
// коробка с фасками 45° по всем рёбрам вдоль X и по торцам
function cb(l,w,h,ch,mat){ch=Math.min(ch,w*.3,h*.3,l*.3);const m=new THREE.Mesh(loftR([{x:-l/2,w:w-2*ch,h:h-2*ch},{x:-l/2+ch,w,h},{x:l/2-ch,w,h},{x:l/2,w:w-2*ch,h:h-2*ch}]),mat);return m}
function poly(pts,th,bev,mat){const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));sh.closePath();const ge=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:1});ge.translate(0,0,-th/2);return new THREE.Mesh(ge,mat)}
const T30=Math.tan(Math.PI/6);
function cyl(r0,r1,len,mat,open){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,len,8,1,!!open),mat);m.rotation.z=Math.PI/2;m.rotation.x=Math.PI/8;return m} // ось вдоль X: r0 у корпуса (+X), r1 на срезе (−X)

// ---- хребет: нос + N секций-ячеек + корма; на каждой секции гнёзда с четырёх сторон ----
function pad(s,mat){const g=new THREE.Group();const b=cb(.5,s,s,s*.3,mat||dark);g.add(b);const r=cb(.3,s*1.25,s*1.25,s*.36,accent);r.position.x=-.12;g.add(r);
 for(const[a,b2]of[[.3,.3],[-.3,.3],[.3,-.3],[-.3,-.3]]){const d=new THREE.Mesh(new THREE.BoxGeometry(.2,.35,.35),cyan);d.position.set(.3,a*s,b2*s);g.add(d)}return g}
// гнёздо на грани: face 'u','d','l','r', центр (x), смещение от оси
function sockets(g,x,w,h,len){const n=Math.max(1,Math.floor(len/7)),s=Math.min(w,h)*.42;
 for(let i=0;i<n;i++){const xx=x+(i-(n-1)/2)*(len/n);
  for(const[fy,fz,ry,rz]of[[1,0,0,-Math.PI/2],[-1,0,0,Math.PI/2],[0,1,Math.PI/2,0],[0,-1,-Math.PI/2,0]]){const p=pad(s);
   // pad по умолчанию смотрит в +X → повернём на нужную грань
   if(fy){p.rotation.z=fy>0?Math.PI/2:-Math.PI/2;p.position.set(xx,fy*(h/2+.05),0)}else{p.rotation.y=fz>0?-Math.PI/2:Math.PI/2;p.position.set(xx,0,fz*(w/2+.05))}
   g.add(p)}}}
function rcs(dir,s){const g=new THREE.Group();g.add(cb(s*2.2,s*2.2,s*1.1,s*.35,silver2));
 for(const[a,b]of[[-.5,-.5],[.5,-.5],[-.5,.5],[.5,.5]]){const n=cyl(s*.34,s*.2,s*.9,dark,true);n.rotation.x=0;n.rotation.z=Math.PI/2*0;const k=new THREE.Group();k.add(n);n.rotation.set(Math.PI/8,0,Math.PI/2);n.rotation.z=0;
  const ng=new THREE.Mesh(new THREE.CylinderGeometry(s*.3,s*.18,s*.9,8,1,true),dark);ng.position.set(a*s*1.1,s*.9,b*s*.9);g.add(ng);
  const gl=new THREE.Mesh(new THREE.CircleGeometry(s*.17,8),cyan);gl.rotation.x=-Math.PI/2;gl.position.set(a*s*1.1,s*1.36,b*s*.9);g.add(gl)}
 g.rotation.set(0,0,0);const o=new THREE.Group();o.add(g);if(dir==='u')return o;if(dir==='d'){o.rotation.x=Math.PI;return o}if(dir==='l'){o.rotation.x=Math.PI/2;return o}o.rotation.x=-Math.PI/2;return o}
function spine(m){const g=new THREE.Group();
 const put=(o,x,y,z)=>{o.position.set(x,y||0,z||0);g.add(o);return o};
 const Wb=10*(1+Math.min(m,8)*.05),tk=t=>1.3-.55*t;
 const secL=15,L=secL*m,x0=-L/2;
 // литое тело: единый лофт со ступенчатыми рёбрами
 const R=[{x:x0-14,w:Wb*1.0,h:Wb*.9},{x:x0-12,w:Wb*1.4,h:Wb*1.2},{x:x0-1,w:Wb*1.4,h:Wb*1.2}];
 for(let i=0;i<m;i++){const t0=i/m,t1=(i+1)/m,a=x0+i*secL,w0=Wb*tk(t0),w1=Wb*tk(t1),bulge=(i%2?1.1:1);
  R.push({x:a+2,w:w0*bulge,h:w0*bulge*.92},{x:a+secL-2,w:w1*bulge,h:w1*bulge*.92},{x:a+secL-.6,w:w1*.9,h:w1*.84})}
 const xe=x0+L,wn=Wb*tk(1);R.push({x:xe+2,w:wn*.85,h:wn*.8},{x:xe+9,w:wn*.6,h:wn*.55},{x:xe+16,w:wn*.4,h:wn*.36});
 g.add(new THREE.Mesh(loftR(R),silver));
 // рёбра-пояса и стыки
 for(let i=0;i<=m;i++){const w=Wb*tk(i/m);put(cb(1.1,w*1.06,w*.98,.35,accent),x0+i*secL,0,0)}
 // гребень сверху и снизу вдоль хребта + гнёзда
 for(let i=0;i<m;i++){const t=(i+.5)/m,w=Wb*tk(t),c=x0+i*secL+secL/2;
  for(const sy of[-1,1])put(cb(secL*.6,w*.4,.9,.3,steel),c,sy*(w*.46+.4),0);
  sockets(g,c,w*.96,w*.88,secL)}
 // литые боковые клинья на стыках через одну
 for(let i=1;i<m;i+=2){const w=Wb*tk(i/m),c=x0+i*secL;for(const sg of[-1,1]){const p=poly([[-6,0],[6,0],[2,4],[-2,4]].map(([a,z])=>[a,sg*z]),1.6,.3,silver2);p.rotation.x=-Math.PI/2;p.position.set(c,-.8,sg*(w/2-.3));g.add(p)}}
 // кормовое гнездо двигателей
 const p=pad(Wb*.8);p.rotation.y=Math.PI;p.position.set(x0-14.1,0,0);g.add(p);
 // манёвровые двигатели: корма, середина, нос; вверх/вниз/в стороны
 const rc=[[x0-6,Wb*1.2,Wb*.6,.9],[0,Wb*tk(.5),0,.8],[xe+4,wn*.58,0,.7]];
 for(const[x,w,_,s]of rc){for(const d of['u','d','l','r']){const r=rcs(d,s*2.4);const o=w*.46+s*1.2;
   if(d==='u')r.position.set(x,o,0);if(d==='d')r.position.set(x,-o,0);if(d==='l')r.position.set(x,0,-o);if(d==='r')r.position.set(x,0,o);g.add(r)}}
 g.userData.mid=-7;return g}
const cam=new THREE.PerspectiveCamera(+q.get('fov')||36,W/H,.1,800);
const m=+q.get('m');
if(m){const b=spine(m);sc.add(b);const az=+q.get('az')||.7,el=+q.get('el')||.35,d=+q.get('d')||110;const mid=b.userData.mid;cam.position.set(mid+Math.cos(el)*Math.cos(az)*d,Math.sin(el)*d,Math.sin(az)*Math.cos(el)*d);cam.lookAt(mid,0,0)}
else{[1,3,5,8].forEach((k,i)=>{const b=spine(k);b.position.set(-b.userData.mid,0,(i-1.5)*55);sc.add(b)});cam.position.set(0,150,260);cam.lookAt(0,0,0)}
const comp=new EffectComposer(ren);comp.setSize(W,H);comp.addPass(new RenderPass(sc,cam));comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.3,.7,.9));comp.addPass(new OutputPass());
comp.render();window.done=true;
</script>
